<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAKC — OBS overlay</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Shim must run before the deferred overlay scripts so window.__TAURI__ exists. -->
    <script src="tauri-shim.js"></script>
    <script defer src="overlay.js"></script>
    <script defer src="devices.js"></script>
    <script defer src="keyboard-layout.js"></script>
    <script defer src="keyboard.js"></script>
  </head>
  <body>
    <div id="popupArea"></div>
    <div id="keyboard" hidden></div>
    <div id="deviceLayer" hidden>
      <div id="mouseWidget" hidden>
        <div id="mouseRing"><div id="mouseDot"></div></div>
      </div>
      <div id="gamepadWidget" hidden>
        <div class="stick" id="leftStick"><div class="stick-dot"></div></div>
        <div class="triggers">
          <div class="trigger"><div class="trigger-fill" id="ltFill"></div><span>LT</span></div>
          <div class="trigger"><div class="trigger-fill" id="rtFill"></div><span>RT</span></div>
        </div>
        <div class="stick" id="rightStick"><div class="stick-dot"></div></div>
      </div>
    </div>
    <div id="notice" hidden></div>
  </body>
</html>
